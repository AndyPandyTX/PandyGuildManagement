# Pushing a tag like v0.3.1 builds PandyGuildManagement-v0.3.1.zip,
# publishes it as a GitHub release and uploads it to CurseForge (project id
# from the .toc, token from the CF_API_KEY repository secret).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2.6.1
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
